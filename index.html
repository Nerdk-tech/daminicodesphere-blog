<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daminicodesphere Blog</title>
  <meta name="description" content="Notes on AI, code and building in public from Daminicodesphere." />
  <meta property="og:title" content="Daminicodesphere Blog" />
  <meta property="og:description" content="Notes on AI, code and building in public from Daminicodesphere." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0C0F15" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C0F15'/%3E%3Ctext x='32' y='42' font-size='30' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%237EE7BB'%3ED%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="./">
        <span class="brand-mark">D</span>
        <span>Daminicodesphere</span>
      </a>
      <nav class="head-nav">
        <a href="https://dani.daminicodesphere.org" target="_blank" rel="noopener">DANI AI</a>
        <a href="https://daminicodesphere.org" target="_blank" rel="noopener">Portfolio</a>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <section class="blog-intro">
      <h1>Notes on AI, code &amp; building in public</h1>
    </section>

    <section class="post-list">
      <div id="postList">
        <p class="loading-inline">Loading…</p>
      </div>
      <p id="emptyState" class="empty-state" hidden>Nothing published yet.</p>
    </section>

  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p class="foot-copy">© <span id="year">2026</span> Daminicodesphere</p>
    </div>
  </footer>

  <script src="js/blog.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    fetch("posts/posts.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(posts => {
        const list = document.getElementById("postList");
        list.innerHTML = "";
        if (!posts.length) {
          document.getElementById("emptyState").hidden = false;
          return;
        }
        posts.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        posts.forEach(p => {
          const a = document.createElement("a");
          a.className = "post-row";
          a.href = "post.html?slug=" + encodeURIComponent(p.slug);
          a.innerHTML =
            "<time>" + esc(fmtDate(p.date)) + "</time>" +
            "<div class='row-main'>" +
              "<h2>" + esc(p.title) + "</h2>" +
              (p.excerpt ? "<p class='row-excerpt'>" + esc(p.excerpt) + "</p>" : "") +
              ((p.tags || []).length
                ? "<p class='row-tags'>" + (p.tags || []).map(t => esc(t)).join(" · ") + "</p>"
                : "") +
            "</div>";
          list.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById("postList").innerHTML = "";
        document.getElementById("emptyState").hidden = false;
      });
  </script>
</body>
</html>
